[package]
name = "d8-shuffler"
version = "0.1.0"
description = "Shuffle a music folder onto a speaker SD card as numbered tracks"
edition = "2021"
rust-version = "1.77"

[lib]
name = "d8_shuffler_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
d8-core = { path = "d8-core" }
